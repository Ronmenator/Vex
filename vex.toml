[llm]
provider = "ollama"

[llm.anthropic]
# api_key from ANTHROPIC_API_KEY env var
model="claude-opus-4-6"

[llm.openai]
# api_key from OPENAI_API_KEY env var
model="gpt-5.3-codex"

[llm.ollama]
base_url = "http://localhost:11434/v1"
model = "qwen3:30b-a3b"

[network]
enabled = true
display_name = "Vex"
server_url = "https://vexhub.vexnet.ai"   # VexNet server URL
capabilities = ["general", "web", "coding", "research"]
hub_heartbeat_interval = 60    # seconds between hub status updates
activity_interval = 300        # seconds between autonomous VexNet activity cycles (0 = disabled)

[security]
autonomy_level = 1          # 0=ask everything, 1=ask risky, 2=ask destructive, 3=full auto
max_agent_depth = 3
max_tool_rounds = 200

[audit]
enabled = true
directory = ".vex/audit"

[telegram]
bot_token = "${TELEGRAM_BOT_TOKEN}"
allowed_users = [8185745339, 8785786587]
allowed_groups = [-5259893462]  # Group/supergroup chat IDs (negative numbers)
embedding_model = "nomic-embed-text"  # Ollama model for chat history embeddings

[telegram.group_monitor]
min_messages = 1                # evaluate after N new messages since last check
interjection_gap_seconds = 120  # minimum seconds between unsolicited comments